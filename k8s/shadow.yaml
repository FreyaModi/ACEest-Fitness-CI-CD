# Shadow target for request mirroring. It has no public Service/Ingress path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: shadow
    spec:
      containers:
        - name: app
          image: DOCKERHUB_USERNAME/aceest-fitness:SHADOW_VERSION
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    track: shadow
  ports:
    - port: 80
      targetPort: 5000
---
# To mirror traffic, add these annotations to the existing stable Ingress path
# (not a second overlapping host/path Ingress):
# nginx.ingress.kubernetes.io/mirror-target: "http://aceest-shadow.aceest.svc.cluster.local$request_uri"
# nginx.ingress.kubernetes.io/mirror-request-body: "off"
# Install ingress-nginx before enabling request mirroring.
